[workspace]
members = ["crates/*"]
resolver = "2"
default-run = "auto-man"

[workspace.dependencies]
clap = { version = "4.5.17", features = ["derive"] }
rust-embed = { version = "8.5.0", features = ["compression"] }

# auto-lang = { git = "https://gitee.com/auto-stack/auto-lang"}
auto-lang = { path = "../auto-lang/crates/auto-lang" }
auto-val = { path = "../auto-lang/crates/auto-val" }
auto-atom = { path = "../auto-lang/crates/auto-atom" }
auto-gen = { path = "../auto-lang/crates/auto-gen" }
# switch to this dynamic lib for debug mode
# gpui = { version = "0.1.0", git = "https://gitee.com/auto-stack/auto-ui", package = "gpui-dynamic" }
# switch to this static lib for release mode
# gpui = { git = "https://github.com/zed-industries/zed" }

# print table in console
tabled = "0.18.0"

# logging
simplelog = "0.12.0"
log = "0.4.26"
normalize-path = "0.2.1"
dialoguer = "0.11.0"
glob = "0.3.2"
dirs = "6.0.0"
git2 = "0.20.1"
reqwest = { version = "0.12", features = ["blocking"] }
version-compare = "0.0.11"
windows-registry = "0.5.1"
colored = "3"
zip = "2.6.1"
glob-match = "0.2.1"
# walkdir = "2"
