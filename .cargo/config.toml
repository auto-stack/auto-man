[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
rustflags = ["-C", "link-arg=/STACK:33554432"]

[build]
jobs = 12

[alias]
t = "nextest run --workspace --lib"
tc = "nextest run -p auto-man-runtime -p auto-man-core -p auto-package-lock -p auto-package-resolver -p auto-toolchain-core -p auto-man-assets -p auto-tool-client --lib"
ti = "nextest run -p auto --test plan816_cli_driver --test cmd_ui --test autodesk_client_smoke -p auto-man-runtime --test plan816_t03_non_ui_service --test plan816_t03_ui_default_fallback --test plan816_t03_ui_inject_explicit_first -p auto-man --test plan803_asset_facade_tests --test plan805_toolchain_parity --test plan805_type_identity --test plan809_management_core --test plan811_media_consumers --test plan815_t04_compat --test plan816_t03_create_jet_default --test plan816_t03_legacy_util_paths --test plan816_t03_sidecar_request --test plan816_t03_ui_inject_compat"

[env]
RUST_MIN_STACK = "16777216"
